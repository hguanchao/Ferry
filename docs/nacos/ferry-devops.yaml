# devops 服务配置样例
#
# 导入 Nacos 时 dataId=ferry-devops.yaml、group=DEFAULT_GROUP、namespace=dev。
# 账号口令通过环境变量注入，样例里不写真实值。

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${FERRY_DB_URL:jdbc:mysql://127.0.0.1:3306/ferry}
    username: ${FERRY_DB_USER:root}
    password: ${FERRY_DB_PASSWORD:}
  data:
    redis:
      host: ${FERRY_REDIS_HOST:127.0.0.1}
      port: ${FERRY_REDIS_PORT:6379}
      password: ${FERRY_REDIS_PASSWORD:}
