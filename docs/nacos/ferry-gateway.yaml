spring:
  cloud:
    loadbalancer:
      nacos:
        enabled: true
      cache:
        enabled: false
    gateway:
      server:
        webflux:
          # 开启网关拉取nacos的服务
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          # 全局过滤API请求路径
          default-filters:
            - StripPrefix=1
          # 跨域配置
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allow-credentials: true
                allowed-origin-patterns: "*"
                allowed-headers: "*"
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                max-age: 18000